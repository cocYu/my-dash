appId: com.mydash.desktop
productName: AtoZ
directories:
  buildResources: build
  output: dist
files:
  - out/**
asar: true
# Go 后端 + 托盘图标作为运行时资源打进安装包
extraResources:
  - from: backend/bin/backend.exe
    to: backend/backend.exe
  - from: resources/icons
    to: icons
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 向导式安装：显示欢迎页、安装模式、安装目录与自定义选项页
  oneClick: false
  perMachine: false
  allowElevation: true
  # 允许用户选择安装目录（自定义目录页由 electron-builder 生成）
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AtoZ
  # 自定义页：是否创建桌面快捷方式（build/installer.nsh）
  include: installer.nsh
  uninstallDisplayName: AtoZ
