version: '1.0'
name: release
displayName: 三端发行构建
triggers:
  trigger: auto
  push:
    tags:
      # 推送 release/x.y.z 形式的 tag 时触发
      prefix:
        - release/
variables:
  GITEE_OWNER: yukai1998
  GITEE_REPO: my-dash
  # GITEE_TOKEN 不要写在这里，请在流水线设置的环境变量/凭证中配置
stages:
  - name: stage-windows
    displayName: Windows 安装包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: build_windows
        displayName: 构建并发布 Windows
        # TODO: 改成「设置 → 主机管理」里 Windows 主机组的 ID
        hostGroupID: REPLACE_WITH_WINDOWS_HOST_GROUP_ID
        script: |
          node scripts/ci/build-and-publish.mjs --platform windows

  - name: stage-linux
    displayName: Linux 安装包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: build_linux
        displayName: 构建并发布 Linux
        # TODO: 改成 Linux 主机组的 ID
        hostGroupID: REPLACE_WITH_LINUX_HOST_GROUP_ID
        script: |
          node scripts/ci/build-and-publish.mjs --platform linux

  - name: stage-macos
    displayName: macOS 安装包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: build_macos
        displayName: 构建并发布 macOS
        # TODO: 改成 macOS 主机组的 ID（必须在 macOS 机器上构建 dmg）
        hostGroupID: REPLACE_WITH_MACOS_HOST_GROUP_ID
        script: |
          node scripts/ci/build-and-publish.mjs --platform macos
